name: Penumbra Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penumbra-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify unsigned arm64 Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintRelease --no-daemon --stacktrace
          APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "name='dev.rhineix.penumbra'"
          while IFS= read -r entry; do
            if [[ "$entry" == lib/*.so && "$entry" != lib/arm64-v8a/*.so ]]; then
              echo "Unexpected native ABI: $entry" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$APK")
          if "$BUILD_TOOLS/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo 'The local release APK must remain unsigned.' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Penumbra-release-arm64-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
