name: Penumbra Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.3.5'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: penumbra-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  BUILD_TOOLS_VERSION: '37.0.0'

jobs:
  release:
    if: ${{ github.event_name != 'push' || (github.event.created && !github.event.deleted) }}
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-37.2' "build-tools;$BUILD_TOOLS_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read release version
        id: version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Use a vMAJOR.MINOR.PATCH tag with an optional prerelease suffix.' >&2
            exit 1
          }
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")"
          [[ "$TAG_COMMIT" == "$(git rev-parse HEAD)" ]] || exit 1
          TAG_COUNT="$(git tag --list 'v*' | wc -l | tr -d '[:space:]')"
          [[ "$TAG_COUNT" =~ ^[1-9][0-9]*$ ]] || exit 1
          {
            echo "name=${TAG_NAME#v}"
            echo "code=$((6 + TAG_COUNT))"
            echo "tag=$TAG_NAME"
            echo "commit=$TAG_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!variable}" ]] || {
              echo "Missing required repository secret: $variable" >&2
              exit 1
            }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/penumbra-signing.jks"
          test -s "$RUNNER_TEMP/penumbra-signing.jks"

      - name: Build Release and run Android Lint
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintRelease --no-daemon --stacktrace \
            -PAPP_VERSION_NAME="$VERSION_NAME" -PAPP_VERSION_CODE="$VERSION_CODE"

      - name: Sign and verify APK
        id: apk
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          INPUT_APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          SIGNED_APK="$RUNNER_TEMP/penumbra-release/Penumbra-${TAG_NAME}-release-arm64.apk"
          test -s "$INPUT_APK"
          mkdir -p "$(dirname "$SIGNED_APK")"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$INPUT_APK"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/penumbra-signing.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --v4-signing-enabled false --out "$SIGNED_APK" "$INPUT_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$SIGNED_APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$SIGNED_APK")"
          grep -Fq "name='dev.rhineix.penumbra' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING"
          while IFS= read -r entry; do
            if [[ "$entry" == lib/*.so && "$entry" != lib/arm64-v8a/*.so ]]; then
              echo "Unexpected native ABI: $entry" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$SIGNED_APK")
          echo "path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Publish signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.commit }}
          name: Penumbra ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Clean signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/penumbra-signing.jks"
